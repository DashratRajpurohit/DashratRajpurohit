<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashrat Rajpurohit - Dev Banner</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Share+Tech+Mono&family=Nunito:wght@600;800&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      /* Cream/Light background theme */
      background-color: #fdf8eb; 
      color: #24292f;
      font-family: 'Nunito', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* Main Banner Container */
    .banner-container {
      width: 1100px;
      height: 350px;
      background: radial-gradient(circle at center, #fffaf0 0%, #f3ead3 100%);
      border: 1px solid #e1d4ba;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      padding: 20px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.05);
      position: relative;
      overflow: hidden;
    }

    /* --- Top Social Bar --- */
    .top-bar {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 15px;
      padding-left: 10px;
      z-index: 2;
    }

    .social-icon {
      width: 24px;
      height: 24px;
      cursor: pointer;
      transition: transform 0.3s ease;
    }
    
    .social-icon:hover {
      transform: scale(1.2);
    }

    .handle {
      font-family: 'Share Tech Mono', monospace;
      font-size: 1.2rem;
      font-weight: bold;
      color: #24292f;
      margin-left: 5px;
    }

    /* --- Three-column layout --- */
    .content-wrapper {
      display: flex;
      flex: 1;
      z-index: 1;
    }

    .left-section, .center-section, .right-section {
      display: flex;
      flex-direction: column;
    }

    /* --- LEFT: Animated Contribution Graph & Achievements --- */
    .left-section {
      width: 25%;
      align-items: center;
      padding-right: 10px;
    }

    .contrib-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
      background: #ffffff;
      padding: 10px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.03);
      margin-bottom: 15px;
    }

    .box {
      width: 14px;
      height: 14px;
      border-radius: 3px;
      background-color: #ebedf0; /* Light theme empty box */
      animation: lightUp 5s infinite alternate;
    }

    /* Randomizing the pulse effect */
    .box:nth-child(3n) { animation-delay: 0.5s; }
    .box:nth-child(2n) { animation-delay: 1.2s; }
    .box:nth-child(5n) { animation-delay: 2.1s; }
    .box:nth-child(7n) { animation-delay: 0.8s; }

    @keyframes lightUp {
      0%, 20% { background-color: #ebedf0; }
      50% { background-color: #9be9a8; }
      80% { background-color: #40c463; }
      100% { background-color: #216e39; }
    }

    .achievements {
      display: flex;
      gap: 5px;
      justify-content: center;
    }

    .achievements img {
      width: 35px;
      height: 35px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      animation: float 4s ease-in-out infinite;
    }
    
    .achievements img:nth-child(2) { animation-delay: 0.5s; }
    .achievements img:nth-child(3) { animation-delay: 1s; }

    /* --- CENTER: Name, Titles, Tech Icons --- */
    .center-section {
      width: 50%;
      align-items: center;
      text-align: center;
      padding: 0 20px;
    }

    .name {
      font-family: 'Nunito', sans-serif;
      font-size: 3rem;
      font-weight: 800;
      color: #3e3b3b;
      letter-spacing: 1px;
      margin-bottom: 5px;
    }

    .subtitle {
      font-family: 'Caveat', cursive;
      font-size: 1.8rem;
      color: #4a4a4a;
      margin-bottom: 20px;
    }

    /* Actual Tech Icons */
    .tech-stack {
      display: flex;
      gap: 15px;
      margin-bottom: 30px;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
    }

    .tech-stack img {
      width: 40px;
      height: 40px;
      transition: all 0.3s ease;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
    }

    .tech-stack img:hover {
      transform: translateY(-8px) scale(1.1);
      filter: drop-shadow(0 8px 12px rgba(0,0,0,0.2));
    }

    /* Typewriter Quote */
    .quote-container {
      height: 30px;
    }
    
    .quote {
      font-family: 'Caveat', cursive;
      font-size: 1.8rem;
      color: #24292f;
      border-right: 2px solid #24292f;
      white-space: nowrap;
      overflow: hidden;
      display: inline-block;
      animation: typing 3s steps(40, end) forwards, blink 0.75s step-end infinite;
    }

    @keyframes typing {
      from { width: 0; }
      to { width: 100%; }
    }
    @keyframes blink {
      from, to { border-color: transparent; }
      50% { border-color: #24292f; }
    }

    /* --- RIGHT: Roles List --- */
    .right-section {
      width: 25%;
      justify-content: center;
      padding-left: 30px;
    }

    .roles-list {
      list-style: none;
    }

    .roles-list li {
      font-family: 'Caveat', cursive;
      margin-bottom: 15px;
      font-size: 1.8rem;
      color: #24292f;
      position: relative;
      padding-left: 25px;
      opacity: 0;
      transform: translateX(20px);
      animation: slideIn 0.5s forwards;
    }

    .roles-list li:nth-child(1) { animation-delay: 1s; }
    .roles-list li:nth-child(2) { animation-delay: 1.5s; }
    .roles-list li:nth-child(3) { animation-delay: 2s; }

    .roles-list li::before {
      content: '•';
      position: absolute;
      left: 0;
      color: #24292f;
      font-family: 'Nunito', sans-serif;
    }

    @keyframes slideIn {
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }
    
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
  </style>
</head>
<body>

  <div class="banner-container">
    
    <div class="top-bar">
      <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/github/github-original.svg" class="social-icon" alt="GitHub">
      <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/linkedin/linkedin-original.svg" class="social-icon" alt="LinkedIn">
      <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/twitter/twitter-original.svg" class="social-icon" alt="X">
      <span class="handle">@DashratRajpurohit</span>
    </div>

    <div class="content-wrapper">
      <div class="left-section">
        <div class="contrib-grid" id="grid">
          </div>
        <div class="achievements">
          <img src="https://github.githubassets.com/assets/pull-shark-default-498c279a747d.png" alt="Pull Shark">
          <img src="https://github.com/drknzz/GitHub-Achievements/blob/main/Media/Badges/YOLO/PNG/YOLO_Badge.png?raw=true" alt="YOLO">
          <img src="https://github.com/drknzz/GitHub-Achievements/blob/main/Media/Badges/Quick-Draw/PNG/Skin-Tones/QuickDraw_SkinTone1.png?raw=true" alt="Quickdraw">
          <img src="https://github.com/drknzz/GitHub-Achievements/blob/main/Media/Badges/Star-Struck/PNG/Skin-Tones/StarStruck_SkinTone1.png?raw=true" alt="Starstruck">
        </div>
      </div>

      <div class="center-section">
        <h1 class="name">Dashrat Rajpurohit</h1>
        <p class="subtitle">Aspiring Full Stack Web Developer, Exploring DSA</p>
        
        <div class="tech-stack">
          <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/cplusplus/cplusplus-original.svg" alt="C++">
          <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/java/java-original.svg" alt="Java">
          <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/python/python-original.svg" alt="Python">
          <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/html5/html5-original.svg" alt="HTML5">
          <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/css3/css3-original.svg" alt="CSS3">
          <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/javascript/javascript-original.svg" alt="JavaScript">
          <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/react/react-original.svg" alt="React">
          <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/nodejs/nodejs-original.svg" alt="NodeJS">
          <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/mongodb/mongodb-original.svg" alt="MongoDB">
          <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/mysql/mysql-original.svg" alt="MySQL">
        </div>

        <div class="quote-container">
          <span class="quote">“Turning Coffee into Code, Dreams into Reality”</span>
        </div>
      </div>

      <div class="right-section">
        <ul class="roles-list">
          <li>Python Developer</li>
          <li>Open Source Contributor</li>
          <li>Web Developer</li>
        </ul>
      </div>
    </div>

  </div>

  <script>
    // Generate the animated grid boxes dynamically
    const grid = document.getElementById('grid');
    // Generating 42 boxes (6 columns x 7 rows roughly matches the layout)
    for (let i = 0; i < 42; i++) {
      const box = document.createElement('div');
      box.classList.add('box');
      
      // Add random permanent green colors to some boxes to make it look like a real commit history
      const randomSeed = Math.random();
      if (randomSeed > 0.8) {
        box.style.backgroundColor = '#216e39';
        box.style.animation = 'none';
      } else if (randomSeed > 0.6) {
        box.style.backgroundColor = '#40c463';
        box.style.animation = 'none';
      }
      
      grid.appendChild(box);
    }
  </script>

</body>
</html>
