<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="14" viewBox="0 0 1000 14" role="img" aria-label="divider">
  <defs>
    <linearGradient id="line-l" x1="0" x2="1">
      <stop offset="0" stop-color="#2da44e" stop-opacity="0"/>
      <stop offset="1" stop-color="#2da44e" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="line-r" x1="0" x2="1">
      <stop offset="0" stop-color="#2da44e" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#2da44e" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glint" x1="0" x2="1">
      <stop offset="0" stop-color="#56d364" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#56d364" stop-opacity="1"/>
      <stop offset="1" stop-color="#56d364" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="track">
      <rect x="0" y="6" width="440" height="2"/>
      <rect x="560" y="6" width="440" height="2"/>
    </clipPath>
  </defs>

  <rect x="0" y="6" width="440" height="2" rx="1" fill="url(#line-l)"/>
  <rect x="560" y="6" width="440" height="2" rx="1" fill="url(#line-r)"/>

  <g clip-path="url(#track)">
    <rect x="-160" y="5" width="160" height="4" fill="url(#glint)">
      <animate attributeName="x" from="-160" to="1000" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- contribution-graph squares -->
  <g>
    <rect x="450" y="2" width="10" height="10" rx="2" fill="#0e4429"/>
    <rect x="465" y="2" width="10" height="10" rx="2" fill="#006d32"/>
    <rect x="480" y="2" width="10" height="10" rx="2" fill="#26a641"/>
    <rect x="495" y="2" width="10" height="10" rx="2" fill="#39d353">
      <animate attributeName="opacity" values="1;0.45;1" dur="2.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="510" y="2" width="10" height="10" rx="2" fill="#26a641"/>
    <rect x="525" y="2" width="10" height="10" rx="2" fill="#006d32"/>
    <rect x="540" y="2" width="10" height="10" rx="2" fill="#0e4429"/>
  </g>
</svg>
