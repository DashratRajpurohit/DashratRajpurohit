<svg xmlns="http://www.w3.org/2000/svg" width="72" height="72" viewBox="0 0 72 72" role="img" aria-label="X">
  <style>
    .stroke{stroke-dasharray:34;stroke-dashoffset:34;animation:draw .35s ease-out forwards}
    .second{animation-delay:.3s}
    @keyframes draw{to{stroke-dashoffset:0}}
    @media (prefers-reduced-motion: reduce){.stroke{animation:none;stroke-dashoffset:0}}
  </style>
  <rect x="3" y="3" width="66" height="66" rx="14" fill="#2da44e" fill-opacity=".12" stroke="#2da44e" stroke-opacity=".7" stroke-width="2"/>
  <g stroke="#2da44e" stroke-width="7" stroke-linecap="round">
    <line class="stroke" x1="24" y1="24" x2="48" y2="48"/>
    <line class="stroke second" x1="48" y1="24" x2="24" y2="48"/>
  </g>
</svg>
