<svg xmlns="http://www.w3.org/2000/svg" width="72" height="72" viewBox="0 0 72 72" role="img" aria-label="O">
  <style>
    .ring{stroke-dasharray:76;stroke-dashoffset:76;animation:draw .5s ease-out forwards}
    @keyframes draw{to{stroke-dashoffset:0}}
    @media (prefers-reduced-motion: reduce){.ring{animation:none;stroke-dashoffset:0}}
  </style>
  <rect x="3" y="3" width="66" height="66" rx="14" fill="#8250df" fill-opacity=".12" stroke="#8250df" stroke-opacity=".7" stroke-width="2"/>
  <circle class="ring" cx="36" cy="36" r="12" fill="none" stroke="#8250df" stroke-width="7" stroke-linecap="round" transform="rotate(-90 36 36)"/>
</svg>
